name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Install Android 17 SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate tag and signing secrets
        env:
          COMSAT_KEYSTORE_BASE64: ${{ secrets.COMSAT_KEYSTORE_BASE64 }}
          COMSAT_KEYSTORE_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version_name}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version_name}" >&2
            exit 1
          fi
          test -n "${COMSAT_KEYSTORE_BASE64}" || {
            echo "COMSAT_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          }
          test -n "${COMSAT_KEYSTORE_PASSWORD}" || {
            echo "COMSAT_KEYSTORE_PASSWORD is not configured" >&2
            exit 1
          }
          umask 077
          keystore_path="${RUNNER_TEMP}/comsat-release.keystore"
          printf '%s' "${COMSAT_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "COMSAT_KEYSTORE=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Test, lint and assemble release
        env:
          COMSAT_KEYSTORE_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
          COMSAT_KEY_ALIAS: comsat
          COMSAT_KEY_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew -Pcomsat.testBuildType=release testReleaseUnitTest lintRelease assembleRelease assembleReleaseAndroidTest --stacktrace

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and exercise the minified release offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          COMSAT_KEYSTORE_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
          COMSAT_KEY_ALIAS: comsat
          COMSAT_KEY_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash tools/run_release_smoke.sh

      - name: Upload release verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify and package APK
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/COMSAT.apk
          apksigner_path="${ANDROID_HOME}/build-tools/37.0.0/apksigner"
          "${apksigner_path}" verify --verbose --print-certs release/COMSAT.apk
          python3 - <<'PY'
          import json, os, pathlib
          metadata = json.loads(pathlib.Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          apk = metadata["elements"][0]
          info = {"applicationId": metadata["applicationId"], "versionName": apk["versionName"],
                  "versionCode": apk["versionCode"], "sourceSha": os.environ["GITHUB_SHA"],
                  "runId": os.environ["GITHUB_RUN_ID"]}
          pathlib.Path("release/build-info.json").write_text(json.dumps(info, indent=2) + "\n")
          PY
          cd release
          sha256sum COMSAT.apk > COMSAT.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: COMSAT-${{ github.ref_name }}-${{ github.run_number }}
          path: release/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release/COMSAT.apk release/COMSAT.apk.sha256 release/build-info.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/COMSAT.apk release/COMSAT.apk.sha256 release/build-info.json \
              --verify-tag \
              --title "COMSAT ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/comsat-release.keystore"
