name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Install Android 17 SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate tag and signing secrets
        env:
          COMSAT_KEYSTORE_BASE64: ${{ secrets.COMSAT_KEYSTORE_BASE64 }}
          COMSAT_KEYSTORE_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test "${GITHUB_REF_NAME}" = "v${version_name}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version_name}" >&2
            exit 1
          }
          test -n "${COMSAT_KEYSTORE_BASE64}" || {
            echo "COMSAT_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          }
          test -n "${COMSAT_KEYSTORE_PASSWORD}" || {
            echo "COMSAT_KEYSTORE_PASSWORD is not configured" >&2
            exit 1
          }
          umask 077
          keystore_path="${RUNNER_TEMP}/comsat-release.keystore"
          printf '%s' "${COMSAT_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "COMSAT_KEYSTORE=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Test, lint and assemble release
        env:
          COMSAT_KEYSTORE_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
          COMSAT_KEY_ALIAS: comsat
          COMSAT_KEY_PASSWORD: ${{ secrets.COMSAT_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Verify and package APK
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/COMSAT.apk
          apksigner_path=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "${apksigner_path}"
          "${apksigner_path}" verify --verbose --print-certs release/COMSAT.apk
          cd release
          sha256sum COMSAT.apk > COMSAT.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: COMSAT-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release/COMSAT.apk release/COMSAT.apk.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/COMSAT.apk release/COMSAT.apk.sha256 \
              --verify-tag \
              --title "COMSAT ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/comsat-release.keystore"
